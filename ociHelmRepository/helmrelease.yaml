apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: my-chart
  namespace: ocihelm
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: podinfo
      version: '6.17.0-acr.1'
      sourceRef:
        kind: HelmRepository
        name: acrrepo
      interval: 1m
  releaseName: my-chart
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
  values:
    replicaCount: 1
    image:
      repository: azurearcfork8sdev.azurecr.io/test-dependencies/stefanprodan/podinfo
      tag: "6.17.0"
      pullPolicy: IfNotPresent
    testImages:
      grpc: azurearcfork8sdev.azurecr.io/test-dependencies/grpc-ecosystem/grpc-health-probe:v0.4.56
      tools: azurearcfork8sdev.azurecr.io/test-dependencies/giantswarm/tiny-tools:8ccea5962d6e
      curl: azurearcfork8sdev.azurecr.io/test-dependencies/curlimages/curl:7.69.0
